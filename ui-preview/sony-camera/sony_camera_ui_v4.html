$('#screen').addEventListener('pointerdown',e=>{let w=e.target.closest('[data-wheel]');if(!w||recording||overlay)return;let q=wheelPoint(e,w);wheelGesture={w,id:e.pointerId,last:q.angle,start:q,acc:0,moved:false};w.setPointerCapture(e.pointerId);e.preventDefault();e.stopImmediatePropagation();},true);
$('#screen').addEventListener('pointermove',e=>{let g=wheelGesture;if(!g||g.id!==e.pointerId)return;let q=wheelPoint(e,g.w);if(g.start.r<46)return;let d=((q.angle-g.last+540)%360)-180;g.last=q.angle;g.acc+=d;if(Math.abs(g.acc)>=8)g.moved=true;while(Math.abs(g.acc)>=wheelStep){let dir=Math.sign(g.acc);g.acc-=dir*wheelStep;wheelAngle+=dir*wheelStep;g.w.querySelector('#wheelTicks').setAttribute('transform',`rotate(${wheelAngle} 109 109)`);feedback();$('#feedback').textContent+=' · 控制转盘 '+(dir>0?'+1':'−1');}e.stopImmediatePropagation();},true);
$('#screen').addEventListener('pointerup',e=>{let g=wheelGesture;if(!g||g.id!==e.pointerId)return;wheelGesture=null;if(!g.moved){let a=g.start.angle,r=g.start.r;let k=r<46?'SET':a>=-135&&a<-45?'上':a>=-45&&a<45?'右':a>=45&&a<135?'下':'左';feedback();$('#feedback').textContent+=' · '+k; }e.preventDefault();e.stopImmediatePropagation();},true);
$('#screen').addEventListener('pointercancel',()=>wheelGesture=null,true);
$('#screen').addEventListener('wheel',e=>{let w=e.target.closest('[data-wheel]');if(!w||recording||overlay)return;e.preventDefault();let dir=Math.sign(e.deltaY||e.deltaX);if(!dir)return;wheelAngle+=dir*wheelStep;w.querySelector('#wheelTicks').setAttribute('transform',`rotate(${wheelAngle} 109 109)`);feedback();$('#feedback').textContent+=' · 控制转盘 '+(dir>0?'+1':'−1');},{passive:false});
let touch;$('#screen').addEventListener('pointerdown',e=>{if(recording)return;touch={x:e.clientX,y:e.clientY,target:e.target.closest('[data-action]')?.dataset.action,local:(e.clientY-$('#screen').getBoundingClientRect().top)/($('#screen').getBoundingClientRect().width/466)}});let suppress=false;$('#screen').addEventListener('click',e=>{if(suppress||recording){e.stopPropagation();e.preventDefault();suppress=false}},true);$('#screen').addEventListener('pointerup',e=>{if(!touch||recording){touch=null;return}let dx=e.clientX-touch.x,dy=e.clientY-touch.y,top=touch.local,target=touch.target;touch=null;let scale=$('#screen').getBoundingClientRect().width/466;dx/=scale;dy/=scale;let acted=false;if(dy>45&&(top<64||overlay===1)){overlay=Math.min(2,overlay+1);if(overlay===1)setTimeout(()=>{if(overlay===1){overlay=0;render()}},1500);acted=true}else if(overlay&&dy<-45){overlay=0;acted=true}else if(page==='preview'&&Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){move(dx<0?1:-1);acted=true}else if(page==='gallery'&&Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){move(dx<0?4:-4);acted=true}else if(page==='value'&&Math.abs(dy)>35){valIdx=Math.max(0,Math.min(options(focusParam).length-1,valIdx+(dy<0?1:-1)));acted=true}else if(page==='dial'&&target?.startsWith('wheel:')&&Math.abs(dx)>16){let i=+target.split(':')[1],n=Math.min(8,Math.max(1,Math.round(Math.abs(dx)/28)));selectedDial=i;for(let j=0;j<n;j++)feedback();toast(['前拨轮','后拨轮'][i]+(dx>0?' +':' −')+' ×'+n);acted=true}if(acted){suppress=true;setTimeout(()=>suppress=false,300);feedback();render()}});
function fit(){let w=Math.min(466,window.innerWidth-26);$('#viewport').style.width=w+'px';$('#viewport').style.height=w+'px';$('.frame').style.transform=`scale(${w/466})`}window.addEventListener('resize',fit);setInterval(()=>{if(recording){let tick=duration(Math.max(0,Math.floor((Date.now()-recStart-(timerAPI?0:500))/1000)));if(tick!==lastTick){lastTick=tick;render()}}if(autoRun){let target=Math.min(count,Math.floor((Date.now()-autoStart)/1000/interval)+1);while(autoLast<target){addMedia('photo',Date.now());autoLast++}if(autoLast>=count){autoRun=false;toast('拍摄完成');render()}}},200);
if(location.search.includes('overview')){document.body.classList.add('overview-mode');$('#overview').hidden=false;let order=['connect','pair','phone','scan','keyboard','finger','home','shoot','movie','rec','params','movieParams','value','preview','delete','remote','dial','gallery','settings','auto','interval'];$('#overview').innerHTML=order.map(k=>{let content;if(k==='rec'){recStart=Date.now()-156500;content=recordView()}else if(k==='movieParams'){paramReturn='movie';content=views.params();paramReturn='shoot'}else if(k==='value'){focusParam='ISO';valIdx=3;content=views.value()}else if(k==='keyboard'){inputValue='a7M5';reveal=true;content=keyboard()}else content=views[k]();return `<div class="tile"><div class="crop"><div class="shell">${content}</div></div><h3>${names[k]}</h3></div>`}).join('')}else{fit();render()}
</script></body></html>
