<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ToolBox OS · 天气布局预览</title>
<style>
@font-face{font-family:MiSans;src:url(assets/MiSans-Regular.woff2)}*{box-sizing:border-box}body{background:#080d18;color:#edf6ff;font-family:MiSans,sans-serif;margin:0;padding:32px}main{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}figure{margin:0;width:min(466px,100%);container-type:inline-size}section{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:radial-gradient(at 35% 0%,#344f78,transparent 60%),linear-gradient(#172c47,#0a182d 80%);text-align:center;display:flex;align-items:center;flex-direction:column;font-size:4cqw;padding-top:8cqw}h2,p{margin:0}h2{font-size:5.8cqw}small,figcaption{color:#a4bcd3}figcaption{text-align:center;margin:14px}strong{font-size:17cqw;line-height:1.08;font-weight:normal}.icon{height:16cqw;width:26cqw}.metrics,nav{display:flex;gap:2cqw;margin-top:2cqw}.metrics span,nav span{background:#213650;border-radius:3cqw;padding:1.4cqw 2.4cqw}.metrics small{display:block;font-size:3cqw}nav span{color:#a7e2ff;border-radius:6cqw}.chart{width:76%;margin:4cqw 0}.rows{width:68%;margin-top:3cqw}.row{display:grid;grid-template-columns:1.1fr 1fr .7fr 1.4fr .7fr;align-items:center;height:8cqw;border-bottom:1px solid #354759;font-size:3.6cqw}.track{position:relative;height:1.2cqw;background:#263c50;border-radius:1cqw}.track i{position:absolute;height:100%;background:linear-gradient(90deg,#72d7ff,#f5cb91);border-radius:1cqw}.actions{font-size:3.5cqw;color:#abc9df;margin-top:1.5cqw}svg text{fill:#b9cee3;font:16px MiSans,sans-serif}
</style><main>
<figure><section><h2>北京</h2><small>11 月 17 日 · 星期二</small><svg class="icon" viewBox="0 0 110 60"><circle cx="67" cy="21" r="13" fill="#ffda96"/><path d="M22 50a13 13 0 0 1 0-26 19 19 0 0 1 36-3 15 15 0 1 1 7 29z" fill="#c8e4f5"/></svg><strong>7°</strong><p>多云 · 体感 5°</p><small>最高 9°　最低 0°</small><div class="metrics"><span><small>湿度</small>66%</span><span><small>西南风</small>3–4 级</span><span><small>AQI</small>47 优</span></div><nav><span>24 小时</span><span>7 日预报</span></nav><p class="actions">城市　·　刷新</p></section><figcaption>天气主页</figcaption></figure>
<figure><section><small>北京</small><h2>24 小时天气</h2><svg class="chart" viewBox="0 0 340 165" id="chart"></svg><div class="metrics"><span><small>最高降水概率</small>20%</span><span><small>累计降水</small>0.2 mm</span></div><p class="actions">返回</p></section><figcaption>逐小时趋势 · 排版示例数据</figcaption></figure>
<figure><section><small>北京</small><h2>7 日预报</h2><div class="rows"></div><p class="actions">返回</p></section><figcaption>每日预报 · 统一温标</figcaption></figure></main><script>
const temps=[7,7,6,5,5,4,3,3,2,1,0,0,1,2,3,4,5,6,7,7,6,5,4,3];
const pts=temps.map((v,i)=>[20+300*i/(temps.length-1),124-v*12]);
chart.innerHTML=[0,4,8].map(t=>'<path stroke="#384e64" d="M20 '+(124-t*12)+'h300"/>').join('')+'<polyline fill="none" stroke="#86dbff" stroke-width="4" stroke-linejoin="round" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>'+[0,6,12,18,23].map(i=>'<text text-anchor="middle" x="'+pts[i][0]+'" y="152">'+((19+i)%24)+'时</text>').join('')+[0,10,19].map(i=>'<text x="'+pts[i][0]+'" y="'+(pts[i][1]-10)+'">'+temps[i]+'°</text>').join('');
const days=[['今天','阴',0,9],['周三','晴',-1,7],['周四','晴',-2,6],['周五','晴',-3,6],['周六','晴',-3,5],['周日','晴',-1,7],['周一','晴',-3,9]];
document.querySelector('.rows').innerHTML=days.map(([w,c,l,h])=>'<div class="row"><b>'+w+'</b><span>'+c+'</span><span>'+l+'°</span><div class="track"><i style="left:'+((l+3)/12*100)+'%;width:'+((h-l)/12*100)+'%"></i></div><span>'+h+'°</span></div>').join('');
</script></html>
